<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#0ea5e9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" fill="#0a0a0f"/>
  <polygon points="50,10 90,50 50,90 10,50" fill="none" stroke="url(#cyberGrad)" stroke-width="2" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="20" fill="none" stroke="url(#cyberGrad)" stroke-width="1.5" filter="url(#glow)"/>
  <text x="50" y="55" text-anchor="middle" fill="url(#cyberGrad)" font-family="serif" font-size="16" filter="url(#glow)">✧</text>
</svg>
